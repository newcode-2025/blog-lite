# Web 服务配置
server:
  port: 8081

spring:
  application:
    name: blog-lite

  # MySQL 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://127.0.0.1:3306/blog_lite?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: "${BLOG_DB_USERNAME:}"
    password: "${BLOG_DB_PASSWORD:}"

    # HikariCP 连接池配置
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  servlet:
    multipart:
      # 单个上传文件最大 10MB
      max-file-size: 10MB
      # 单次请求最大 20MB，供批量上传使用
      max-request-size: 20MB

  # SMTP 邮件配置，默认关闭，生产环境通过环境变量启用
  mail:
    host: "${BLOG_MAIL_HOST:}"
    port: "${BLOG_MAIL_PORT:25}"
    username: "${BLOG_MAIL_USERNAME:}"
    password: "${BLOG_MAIL_PASSWORD:}"
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: "${BLOG_MAIL_SMTP_AUTH:false}"
          starttls:
            enable: "${BLOG_MAIL_STARTTLS:false}"
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

  # Quartz 使用内存任务存储，数据库中的 scheduled_job 是任务定义的唯一来源
  quartz:
    job-store-type: memory
    auto-startup: true

# MyBatis-Plus 配置
mybatis-plus:
  # XML Mapper 文件位置
  mapper-locations: classpath*:/mapper/**/*.xml

  # 实体类包路径
  type-aliases-package: com.example.bloglite.entity

  configuration:
    # 数据库字段 user_name 自动映射到 Java 属性 userName
    map-underscore-to-camel-case: true

    # 在控制台打印执行的 SQL，方便学习和调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  global-config:
    # 关闭 MyBatis-Plus 启动 Banner
    banner: false

    db-config:
      # 数据库主键使用 AUTO_INCREMENT，Java 使用 Long
      id-type: auto

# JWT 配置
blog:
  jwt:
    # JWT 签发者
    issuer: blog-lite

    # 本地开发默认密钥；生产环境通过 BLOG_JWT_SECRET 环境变量覆盖
    secret: "${BLOG_JWT_SECRET:${BLOG_JWT_SECRET:}}"

    # 令牌有效期，单位：分钟
    expiration-minutes: 120

  # 邮件业务配置
  mail:
    enabled: "${BLOG_MAIL_ENABLED:false}"
    from: "${BLOG_MAIL_FROM:}"
    from-name: "${BLOG_MAIL_FROM_NAME:blog-lite}"

  # 网站访问统计配置
  stats:
    # 生产环境通过 BLOG_STATS_VISITOR_HASH_SALT 覆盖
    visitor-hash-salt: "${BLOG_STATS_VISITOR_HASH_SALT:${BLOG_STATS_VISITOR_HASH_SALT:}}"

  # 内置任务和日志保留配置
  tasks:
    operation-log-retention-days: 30
    exception-log-retention-days: 90
    job-log-retention-days: 30
    notification-retry-max-count: 3
    notification-retry-batch-size: 50

  # 本地上传配置
  upload:
    # 固定保存在项目根目录的 uploads 下，保证克隆项目后即可使用
    local-dir: "./uploads"
    # 本项目内置的静态访问前缀
    public-path: "/uploads"
    # 单张图片业务层大小限制
    max-file-size: 10MB
    # 单次最多上传图片数量
    max-batch-count: 9
    # 单张图片最大像素总数，用于防止异常大图占用过多内存
    max-image-pixels: 40000000
