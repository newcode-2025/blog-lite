# Web 服务配置
server:
  port: 8081

spring:
  application:
    name: blog-lite

  # MySQL 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://127.0.0.1:3306/blog_lite?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: "${BLOG_DB_USERNAME:}"
    password: "${BLOG_DB_PASSWORD:}"

    # HikariCP 连接池配置
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  servlet:
    multipart:
      # 单个上传文件最大 10MB
      max-file-size: 10MB
      # 单次请求最大 20MB，供批量上传使用
      max-request-size: 20MB

# MyBatis-Plus 配置
mybatis-plus:
  # XML Mapper 文件位置
  mapper-locations: classpath*:/mapper/**/*.xml

  # 实体类包路径
  type-aliases-package: com.example.bloglite.entity

  configuration:
    # 数据库字段 user_name 自动映射到 Java 属性 userName
    map-underscore-to-camel-case: true

    # 在控制台打印执行的 SQL，方便学习和调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  global-config:
    # 关闭 MyBatis-Plus 启动 Banner
    banner: false

    db-config:
      # 数据库主键使用 AUTO_INCREMENT，Java 使用 Long
      id-type: auto

# JWT 配置
blog:
  jwt:
    # JWT 签发者
    issuer: blog-lite

    # 本地开发默认密钥；生产环境通过 BLOG_JWT_SECRET 环境变量覆盖
    secret: "${BLOG_JWT_SECRET:${BLOG_JWT_SECRET:}}"

    # 令牌有效期，单位：分钟
    expiration-minutes: 120

  # 本地上传配置
  upload:
    # 保存目录可通过环境变量覆盖
    local-dir: "${BLOG_UPLOAD_DIR:./uploads}"
    # 静态访问前缀
    public-path: "${BLOG_UPLOAD_PUBLIC_PATH:/uploads}"
    # 对外访问根地址
    public-base-url: "${BLOG_UPLOAD_PUBLIC_BASE_URL:http://localhost:8081}"
    # 单张图片业务层大小限制
    max-file-size: 10MB
    # 单次最多上传图片数量
    max-batch-count: 9
    # 单张图片最大像素总数，用于防止异常大图占用过多内存
    max-image-pixels: 40000000
